<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HA GitOps</title>
<style>
:root {
  --bg:#f5f6f8; --card:#ffffff; --text:#1c2733; --muted:#5b6875; --border:#e3e6ea;
  --code-bg:#f0f2f5; --diff-bg:#fbfcfd;
  --primary:#0277bd; --primary-text:#ffffff; --primary-press:#01639f;
  --base:#4a5562; --base-bg:#eceef1; --base-sw:#8a95a1;
  --live:#9a4a00; --live-bg:#fdecd9; --live-sw:#e8892b;
  --target:#0b5cad; --target-bg:#e2effc; --target-sw:#2f86d8;
  --both:#b42318; --both-bg:#fde9e7;
  --ok:#1e7e34; --ok-bg:#e5f3e8;
  --warn:#7a5000; --warn-bg:#fdf1d2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:#111417; --card:#1c2126; --text:#e3e6ea; --muted:#a3adb7; --border:#2d353d;
    --code-bg:#14181c; --diff-bg:#171c21;
    --primary:#29b6f6; --primary-text:#0b1216; --primary-press:#4fc3f7;
    --base:#c3cad2; --base-bg:rgba(255,255,255,.07); --base-sw:#7d8792;
    --live:#ffb870; --live-bg:rgba(255,152,0,.15); --live-sw:#f0a04b;
    --target:#8cc8ff; --target-bg:rgba(56,139,253,.17); --target-sw:#58a6ff;
    --both:#ff9b8f; --both-bg:rgba(244,67,54,.16);
    --ok:#7bc88a; --ok-bg:rgba(76,175,80,.16);
    --warn:#ffca6a; --warn-bg:rgba(255,152,0,.14);
  }
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text); line-height: 1.5;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
button { font: inherit; }
.shell {
  max-width: 90rem; margin: 0 auto; padding: 20px 16px 48px;
  display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;
}
.content { flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 14px; }

.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.brand svg { color: var(--primary); flex: none; }
h1 { font-size: 19px; margin: 0; font-weight: 650; }
.muted { color: var(--muted); font-size: 14px; }

.btn {
  font: 600 14px system-ui, sans-serif; border: 1px solid var(--border);
  background: var(--card); color: var(--text); border-radius: 8px; padding: 0 14px;
  min-height: 44px; cursor: pointer; display: inline-flex; align-items: center;
  justify-content: center; gap: 8px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--primary); color: var(--primary-text); border-color: transparent; }
.btn.primary:hover { background: var(--primary-press); }
.btn[disabled] { opacity: .5; cursor: default; }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 10px; font-weight: 650; font-size: 12.5px; white-space: nowrap; }
.p-warn { color: var(--warn); background: var(--warn-bg); }
.p-ok { color: var(--ok); background: var(--ok-bg); }
.p-bad { color: var(--both); background: var(--both-bg); white-space: normal; }

.banner { border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 550; margin: 0; }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--both-bg); color: var(--both); }
.banner.ok { background: var(--ok-bg); color: var(--ok); }

.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.fchip {
  min-height: 40px; border-radius: 999px; border: 1px solid var(--border); background: var(--card);
  color: var(--muted); font: 600 13px system-ui, sans-serif; padding: 0 14px;
  display: inline-flex; gap: 8px; align-items: center; cursor: pointer;
}
.fchip[aria-pressed="true"] { color: var(--text); border-color: var(--text); }
.fchip .n { background: var(--code-bg); border-radius: 999px; padding: 0 7px; font-size: 12px; }

.vers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 720px) { .vers { grid-template-columns: minmax(0, 1fr); } }
.ver {
  text-align: left; color: var(--text); cursor: pointer; border: 1px dashed var(--border);
  background: transparent; border-radius: 12px; padding: 10px 14px; display: flex; gap: 10px;
  align-items: flex-start; min-height: 44px;
}
.ver[aria-pressed="true"] { border-style: solid; background: var(--card); }
.ver[aria-pressed="false"] .vtext { opacity: .7; }
.ver[disabled] { cursor: default; }
.sw { width: 10px; height: 10px; border-radius: 3px; margin-top: 6px; flex: none; }
.sw.base { background: var(--base-sw); }
.sw.live { background: var(--live-sw); }
.sw.target { background: var(--target-sw); }
.vtop { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.vn { font-weight: 650; font-size: 14px; }
.vstate { font-size: 11.5px; font-weight: 650; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; }
.vbuf { font-size: 11.5px; font-weight: 650; color: var(--primary); }
.vd { display: block; color: var(--muted); font-size: 13px; }
.vd code { font-size: 12px; background: var(--code-bg); color: var(--text); padding: 1px 5px; border-radius: 4px; }
.hint { margin: 0; color: var(--muted); font-size: 13px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.fh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; }
.path { font-weight: 650; font-size: 14.5px; }
.since { color: var(--muted); font-size: 13px; }
.k-live { color: var(--live); background: var(--live-bg); }
.k-target { color: var(--target); background: var(--target-bg); }
.k-both { color: var(--both); background: var(--both-bg); }
.s-base { color: var(--base); background: var(--base-bg); }
.s-live { color: var(--live); background: var(--live-bg); }
.s-target { color: var(--target); background: var(--target-bg); }
.note { margin: 0; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 13.5px; color: var(--muted); }

.scroll { overflow-x: auto; background: var(--diff-bg); border-top: 1px solid var(--border); }
.grid { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; line-height: 1.6; padding-bottom: 6px; }
.grid.n2 { min-width: 580px; }
.grid.n3 { min-width: 860px; }
.row { display: grid; }
.row.names { border-bottom: 1px solid var(--border); background: var(--card); font-family: system-ui, sans-serif; font-size: 12.5px; font-weight: 650; }
.nm { padding: 6px 12px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.nm code { font-weight: 500; font-size: 12px; }
.nm .bufn { font-weight: 500; font-size: 11.5px; color: var(--primary); }
.nm.base { color: var(--base); }
.nm.live { color: var(--live); }
.nm.target { color: var(--target); }

.c { display: flex; gap: 10px; padding: 0 10px; min-height: 1.6em; min-width: 0; }
.c .tx { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.no { width: 3.4ch; flex: none; text-align: right; color: var(--muted); background: none; border: 0; padding: 0; font: inherit; user-select: none; }
button.no { cursor: pointer; }
button.no:hover { text-decoration: underline dotted; }
button.no[aria-pressed="true"] { color: var(--primary); font-weight: 700; }
.c.base { color: var(--base); background: var(--base-bg); }
.c.live { color: var(--live); background: var(--live-bg); }
.c.target { color: var(--target); background: var(--target-bg); }
.c.gap { background: var(--code-bg); }
.c.sel { box-shadow: inset 3px 0 0 var(--primary); }
.c.stc { padding: 1px 6px 1px 10px; }
.stack { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.ol, .sl { display: flex; gap: 10px; min-width: 0; }
.ol { color: var(--muted); }
.ol .tx { text-decoration: line-through; text-decoration-thickness: 1px; }
.sl { border-radius: 3px; margin-left: -4px; padding: 0 4px; font-style: italic; }
.sl .no { font-style: normal; font-weight: 700; color: inherit; }
.c.rb { position: relative; margin: 0 4px; border-left: 1px dashed; border-right: 1px dashed; }
.c.rb-first { border-top: 1px dashed; border-top-left-radius: 6px; border-top-right-radius: 6px; margin-top: 4px; }
.c.rb-last { border-bottom: 1px dashed; border-bottom-left-radius: 6px; border-bottom-right-radius: 6px; margin-bottom: 4px; }
.c.rb-base { border-color: var(--base-sw); }
.c.rb-live { border-color: var(--live-sw); }
.c.rb-target { border-color: var(--target-sw); }
.undo {
  position: absolute; top: -10px; right: 8px; z-index: 1; width: 22px; height: 18px;
  border-radius: 4px; border: 0; background: var(--diff-bg); display: inline-flex;
  align-items: center; justify-content: center; cursor: pointer; padding: 0;
}
.undo:hover { background: var(--code-bg); }
.a-base { color: var(--base); }
.a-live { color: var(--live); }
.a-target { color: var(--target); }

.row.head { padding-top: 8px; }
.hd { padding: 2px 12px 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: system-ui, sans-serif; }
.tag { font-family: system-ui, sans-serif; font-weight: 650; font-size: 11.5px; border-radius: 999px; padding: 0 8px; line-height: 1.8; white-space: nowrap; }
.st-chip { font-size: 11.5px; font-weight: 650; color: var(--muted); }
.linkbtn { font: 600 12px system-ui, sans-serif; color: var(--primary); background: none; border: 1px solid transparent; border-radius: 6px; padding: 0 8px; min-height: 30px; cursor: pointer; }
.linkbtn:hover { border-color: var(--border); }
.fold { grid-column: 1 / -1; display: flex; }
.fold button {
  flex: 1; text-align: left; border: 0; background: var(--code-bg); color: var(--muted);
  font: italic 12.5px system-ui, sans-serif; padding: 4px 12px; cursor: pointer;
}
.fold button:hover { color: var(--text); }

.g { position: relative; min-height: 1.6em; }
.bar { position: absolute; top: 0; bottom: 0; width: 2px; border-radius: 1px; }
.bar-l { left: 6px; }
.bar-r { right: 6px; }
.bar.cap-t { top: 5px; }
.bar.cap-b { bottom: 5px; }
.bar.a-base { background: var(--base-sw); }
.bar.a-live { background: var(--live-sw); }
.bar.a-target { background: var(--target-sw); }
.arr2 {
  position: absolute; top: 1px; z-index: 1; width: 22px; height: 20px; border-radius: 4px;
  border: 0; background: transparent; display: inline-flex; align-items: center;
  justify-content: center; padding: 0; cursor: pointer;
}
.arr2:hover { background: var(--code-bg); }
.arr2.arr-r { left: 9px; }
.arr2.arr-l { right: 9px; }

.empty { text-align: center; color: var(--muted); padding: 3.5rem 1rem; }
.empty .lead { color: var(--text); font-weight: 600; font-size: 1.05rem; margin: .2rem 0; }

.side { flex: 1 1 320px; min-width: 0; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.sidehead { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
.sec { border-bottom: 1px solid var(--border); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.sec:last-child { border-bottom: 0; }
.sech { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13.5px; }
.sech .sw { margin-top: 0; }
.sech .dir { color: var(--muted); font-weight: 500; font-size: 12px; margin-left: auto; white-space: nowrap; }
.badge { background: var(--code-bg); border-radius: 999px; padding: 0 7px; font-size: 12px; font-weight: 650; }
.msg { font: 14px system-ui, sans-serif; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: var(--card); color: var(--text); resize: vertical; min-height: 60px; width: 100%; }
.msg::placeholder { color: var(--muted); }
.msg:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-color: transparent; }
.sec .empty-hint { margin: 0; color: var(--muted); font-size: 12.5px; }
.tf { display: flex; align-items: center; gap: 6px; font-size: 13px; min-height: 30px; }
.tf svg { color: var(--muted); flex: none; }
.tf .fn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; background: none; border: 0; padding: 0; color: var(--text); text-align: left; cursor: pointer; font-size: 13px; }
.th { display: flex; align-items: center; gap: 6px; padding-left: 22px; font-size: 12.5px; min-height: 36px; flex-wrap: wrap; }
.th .hl { flex: 1; min-width: 0; color: var(--muted); }
.x { width: 36px; height: 36px; flex: none; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.x:hover { border-color: var(--border); color: var(--text); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="shell">
  <main class="content" id="main" aria-live="polite"><p class="muted">Loading…</p></main>
  <aside class="side" id="side" aria-label="Staged buffers"></aside>
</div>
<script>
(function () {
  'use strict';

  // ---------- model ----------

  // Columns in display order. Rows from the server are [base, live,
  // target] with null where a version has no such line.
  var VERS = [
    { key: 'base', i: 0, name: 'last-applied' },
    { key: 'live', i: 1, name: 'live' },
    { key: 'target', i: 2, name: 'target' }
  ];
  var VER = { base: VERS[0], live: VERS[1], target: VERS[2] };
  var KIND = {
    both: { label: 'both changed', cls: 'k-both' },
    live: { label: 'live changed', cls: 'k-live' },
    target: { label: 'target changed', cls: 'k-target' }
  };
  // Live and target are buffers: per line, their own content or a line
  // picked from another version. Last-applied is never written. Promote
  // only takes applied live content, so a staged live line must be
  // applied before it can be promoted; the target buffer therefore only
  // ever holds content live already has.
  var OPS = {
    revert: { into: 'live', from: 'base', verb: 'Stage last-applied into live' },
    apply: { into: 'live', from: 'target', verb: 'Stage target into live' },
    promote: { into: 'target', from: 'live', block: 'live', verb: 'Stage live into target' }
  };
  var CTX = 3;

  function load(k, d) {
    try { var v = JSON.parse(localStorage.getItem('gitops.' + k)); return v || d; } catch (e) { return d; }
  }
  function save(k, v) {
    try { localStorage.setItem('gitops.' + k, JSON.stringify(v)); } catch (e) { /* per-viewer nicety only */ }
  }

  var S = {
    data: null,
    files: [],
    show: load('show', { base: false, live: true, target: true }),
    filter: 'all',
    buf: {},      // rel -> { token, live: {row: src}, target: {row: src} }
    sel: {},      // rel -> { row: true }
    anchor: null, // last clicked line, for shift-click ranges
    open: {},     // expanded folds
    busy: '',
    notice: null  // { text, bad }
  };
  if (['base', 'live', 'target'].filter(function (k) { return S.show[k]; }).length < 2) {
    S.show = { base: false, live: true, target: true };
  }

  function prepare(af) {
    var n = [0, 0, 0];
    var rows = af.rows.map(function (v, i) {
      return { i: i, v: v, no: v.map(function (x, c) { return x === null ? '' : String(++n[c]); }) };
    });
    return Object.assign({}, af, { rows: rows });
  }

  function bufOf(f) {
    var b = S.buf[f.rel];
    if (!b) { b = S.buf[f.rel] = { token: f.token, live: {}, target: {} }; }
    return b;
  }
  function staged(f, r, key) {
    return key !== 'base' && !!(S.buf[f.rel] && S.buf[f.rel][key][r.i]);
  }
  // What a column shows: its buffer content for live and target.
  function value(f, r, key) {
    var src = key === 'base' ? null : S.buf[f.rel] && S.buf[f.rel][key][r.i];
    return r.v[VER[src || key].i];
  }
  // What an op copies: the target buffer for apply, original content
  // otherwise (promote reads applied live only; last-applied is fixed).
  function source(f, r, op) {
    return op.from === 'target' ? value(f, r, 'target') : r.v[VER[op.from].i];
  }
  function eligible(f, r, op) {
    return value(f, r, op.into) !== source(f, r, op) && !(op.block && staged(f, r, op.block));
  }
  function picked(f, r) { return !!(S.sel[f.rel] && S.sel[f.rel][r.i]); }

  function stageRows(f, op, rows) {
    var b = bufOf(f);
    rows.forEach(function (r) {
      // Copying a line back to the buffer's own content is an unstage —
      // e.g. applying a target line that was itself promoted from live.
      if (source(f, r, op) === r.v[VER[op.into].i]) delete b[op.into][r.i];
      else b[op.into][r.i] = op.from;
    });
    delete S.sel[f.rel];
    render();
  }
  function unstageRows(f, rows, keys) {
    var b = bufOf(f);
    rows.forEach(function (r) { keys.forEach(function (k) { delete b[k][r.i]; }); });
    render();
  }

  function lineCount(rows) { return rows.length; }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function rangeLabel(rows, col) {
    var nums = rows.map(function (r) { return r.no[col] || r.no[0] || r.no[2] || r.no[1]; }).filter(Boolean);
    if (!nums.length) return plural(rows.length, 'line');
    var span = nums[0] === nums[nums.length - 1] ? 'line ' + nums[0] : 'lines ' + nums[0] + '–' + nums[nums.length - 1];
    return rows.length > 1 && rows.length !== nums.length ? span + ' · ' + plural(rows.length, 'line') : span;
  }

  // Runs of consecutive staged lines from one source in a buffer column.
  // Rows where the column has no line either way don't break a run.
  function runsIn(f, key, rows) {
    var runs = [], cur = null, pending = [];
    rows.forEach(function (r) {
      var src = S.buf[f.rel] && S.buf[f.rel][key][r.i];
      if (!src && r.v[VER[key].i] === null) { if (cur) pending.push(r); return; }
      if (!src) { cur = null; pending = []; return; }
      if (cur && cur.src === src) { cur.span = cur.span.concat(pending, [r]); cur.rows.push(r); pending = []; return; }
      cur = { src: src, rows: [r], span: [r] };
      pending = [];
      runs.push(cur);
    });
    return runs;
  }

  // ---------- reconciling buffers with fresh state ----------

  function compose(f, key, picks) {
    var own = VER[key].i, out = [];
    f.rows.forEach(function (r) {
      var v = r.v[picks[r.i] ? VER[picks[r.i]].i : own];
      if (v !== null) out.push(v);
    });
    return out;
  }

  // Re-derive picks on new rows that reproduce the same buffer content,
  // or null when the content can't be rebuilt from the allowed sources.
  function restage(f, key, desired) {
    var own = VER[key].i;
    var srcs = key === 'live' ? ['base', 'target'] : ['live'];
    var picks = {}, j = 0;
    for (var k = 0; k < f.rows.length; k++) {
      var r = f.rows[k], want = desired[j], ownV = r.v[own], hit = null;
      if (ownV !== null && ownV === want) { j++; continue; }
      for (var s = 0; s < srcs.length && hit === null; s++) {
        if (r.v[VER[srcs[s]].i] !== null && r.v[VER[srcs[s]].i] === want) hit = srcs[s];
      }
      if (hit !== null) { picks[r.i] = hit; j++; continue; }
      if (ownV === null) continue;
      for (s = 0; s < srcs.length && hit === null; s++) {
        if (r.v[VER[srcs[s]].i] === null) hit = srcs[s];
      }
      if (hit === null) return null;
      picks[r.i] = hit;
    }
    return j === desired.length ? picks : null;
  }

  // ingest takes fresh state, keeping staging for unchanged files and
  // rebuilding it on changed ones. done names a buffer just written for
  // the given files; its staging is dropped instead.
  function ingest(data, done) {
    var old = {};
    S.files.forEach(function (f) { old[f.rel] = f; });
    S.data = data;
    S.files = data.files.map(prepare);
    var buf = {}, lost = [];
    S.files.forEach(function (f) {
      var b = S.buf[f.rel], of = old[f.rel];
      if (!b || !of) return;
      if (b.token === f.token && !(done && done.rels.indexOf(f.rel) >= 0)) { buf[f.rel] = b; return; }
      var nb = { token: f.token, live: {}, target: {} };
      ['live', 'target'].forEach(function (key) {
        if (!Object.keys(b[key]).length) return;
        if (done && done.key === key && done.rels.indexOf(f.rel) >= 0) return;
        if (b.token === f.token) { nb[key] = b[key]; return; }
        var p = restage(f, key, compose(of, key, b[key]));
        if (p) nb[key] = p; else lost.push(f.rel + ' (' + key + ')');
      });
      buf[f.rel] = nb;
      delete S.sel[f.rel];
    });
    Object.keys(S.sel).forEach(function (rel) { if (!buf[rel] && !S.files.some(function (f) { return f.rel === rel; })) delete S.sel[rel]; });
    S.buf = buf;
    if (lost.length) {
      S.notice = { bad: true, text: 'Staging cleared for ' + lost.join(', ') + ': the file changed and the staged lines no longer fit. Stage them again.' };
    }
  }

  // ---------- server ----------

  function request(method, url, body) {
    return fetch(url, {
      method: method,

    var fileRow = function (f, n) {

        h('button', { type: 'button', class: 'fn', onclick: function () {
          var el = document.getElementById('file-' + f.rel);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } }, f.rel),
        h('span', { class: 'badge', text: String(n) }));
    };
    var total = function (key) {
      var n = 0;
      Object.keys(S.buf).forEach(function (rel) { n += Object.keys(S.buf[rel][key]).length; });
      return n;
    };
    var nLive = total('live'), nTarget = total('target');

    var unstaged = [], nUn = 0;
    S.files.forEach(function (f) {
      var runs = [], cur = null;
      f.rows.forEach(function (r) {
        var open = value(f, r, 'live') !== value(f, r, 'target') && !staged(f, r, 'live') && !staged(f, r, 'target');
        if (!open) { cur = null; return; }
        if (!cur) { cur = []; runs.push(cur); }
        cur.push(r);
      });
      if (!runs.length) return;
      nUn += runs.length;
      unstaged.push(fileRow(f, runs.length), runs.map(function (rows) {
        return h('div', { class: 'th' }, h('span', { class: 'hl', text: rangeLabel(rows, 1) }),
          h('span', { class: 'tag ' + KIND[f.kind].cls, text: KIND[f.kind].label }));
      }));
    });

    fill(side, [
      h('div', { class: 'sidehead' }, h('span', { text: 'Staged buffers' }), h('span', { text: plural(nLive + nTarget, 'line') + ' staged' })),
      h('section', { class: 'sec', 'aria-label': 'Live buffer' },
        h('div', { class: 'sech' }, h('span', { class: 'sw live' }), h('span', { text: 'Live buffer' }),
          h('span', { class: 'badge', text: String(nLive) }), h('span', { class: 'dir', text: '→ Home Assistant' })),
        h('button', { type: 'button', class: 'btn' + (nLive ? ' primary' : ''), disabled: !nLive || !!S.busy, onclick: doApply },
          nLive ? 'Apply ' + plural(nLive, 'line') + ' to live' : 'Apply to live'),
        nLive ? null : h('p', { class: 'empty-hint', text: 'Nothing staged. Use |→ from last-applied or ←| from target.' }),
        tree('live', true)),
      h('section', { class: 'sec', 'aria-label': 'Target buffer' },
        h('div', { class: 'sech' }, h('span', { class: 'sw target' }), h('span', { text: 'Target buffer' }),
          h('span', { class: 'badge', text: String(nTarget) }), h('span', { class: 'dir', text: '→ ' + (S.data.branch || 'git') })),
        h('label', { class: 'sr', for: 'commit-msg', text: 'Commit message' }), msgBox,
        h('button', { type: 'button', class: 'btn' + (nTarget ? ' primary' : ''), disabled: !nTarget || !!S.busy, onclick: doCommit },
          nTarget ? 'Commit & push ' + plural(nTarget, 'line') : 'Commit & push'),
        nTarget ? null : h('p', { class: 'empty-hint', text: 'Nothing staged. Use |→ from live (applied lines only).' }),
        tree('target', true)),
      h('section', { class: 'sec', 'aria-label': 'Unstaged differences' },
        h('div', { class: 'sech' }, h('span', { text: 'Unstaged differences' }), h('span', { class: 'badge', text: String(nUn) }),
          h('span', { class: 'dir', text: 'live ≠ target' })),
        unstaged)]);
  }

  // Text selection across diff rows selects those lines.
  document.addEventListener('mouseup', function () {
    var sel = window.getSelection();
    if (!sel || sel.isCollapsed) return;
    var main = document.getElementById('main');
    if (!main.contains(sel.anchorNode)) return;
    var any = false;
    main.querySelectorAll('.row[data-rel]').forEach(function (el) {
      if (!sel.containsNode(el, true)) return;
      var rel = el.getAttribute('data-rel'), i = Number(el.getAttribute('data-i'));
      var f = S.files.filter(function (x) { return x.rel === rel; })[0];
      if (!f) return;
      if (!any) { S.sel = {}; any = true; }
      (S.sel[rel] = S.sel[rel] || {})[i] = true;
    });
    if (any) { sel.removeAllRanges(); render(); }
  });

  request('GET', 'api/state').then(function (data) { ingest(data, null); render(); }).catch(function (err) {
    document.getElementById('main').replaceChildren(h('p', { class: 'banner bad', text: 'Could not load state: ' + err.message }));
  });
})();
</script>
</body>
</html>
